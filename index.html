<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ESAZ 법인 Vision BMPD 분석 (ESAZ Vision Downtime Analysis)</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			font-family: 'Malgun Gothic', sans-serif;
		}

		body {
			background-color: #f5f5f5;
			display: flex;
			justify-content: center;
			padding: 20px 10px;
		}

		.container {
			width: 100%;
			max-width: 450px;
			background: white;
			border: 1px solid #e0e0e0;
			border-radius: 4px;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
		}

		.header {
			background-color: #444;
			color: white;
			text-align: center;
			padding: 25px 15px;
		}

		.header h1 {
			font-size: 20px;
			font-weight: bold;
			margin-bottom: 10px;
			line-height: 1.4;
		}

		.header p {
			font-size: 13px;
			color: #ccc;
		}

		.tabs {
			background: #333;
			color: white;
			text-align: center;
			padding: 12px 0;
			font-size: 14px;
			font-weight: bold;
		}

		.form-body {
			padding: 20px;
		}

		.form-group {
			margin-bottom: 18px;
		}

		.form-group label {
			display: block;
			font-size: 14px;
			font-weight: bold;
			margin-bottom: 6px;
			color: #111;
		}

		.time-input-group {
			display: flex;
			gap: 5px;
		}

		.btn-time {
			padding: 0 10px;
			background: #6c757d;
			color: white;
			border: none;
			border-radius: 4px;
			font-size: 12px;
			cursor: pointer;
			white-space: nowrap;
		}

		.btn-time:hover {
			background: #5a6268;
		}

		select,
		input[type="text"],
		input[type="datetime-local"],
		textarea {
			width: 100%;
			padding: 10px;
			font-size: 14px;
			border: 1px solid #ddd;
			border-radius: 4px;
			background-color: #fafafa;
			outline: none;
			color: #333;
		}

		select:focus,
		input[type="text"]:focus,
		input[type="datetime-local"]:focus,
		textarea:focus {
			background-color: #fff;
			border-color: #888;
		}

		.time-hint {
			font-size: 12px;
			color: #888;
			margin: -10px 0 18px;
		}

		textarea {
			resize: vertical;
			min-height: 80px;
		}

		.btn-submit {
			width: 100%;
			background-color: #007bff;
			color: white;
			border: none;
			padding: 14px;
			font-size: 15px;
			font-weight: bold;
			border-radius: 4px;
			cursor: pointer;
		}

		.btn-submit:disabled {
			background-color: #ccc;
			cursor: not-allowed;
		}

		.footer-mark {
			text-align: right;
			color: #aaa;
			font-size: 12px;
			margin-top: 15px;
		}
	</style>
</head>

<body>

	<div class="container">
		<div class="header">
			<h1>ESAZ 법인 Vision<br>BMPD 분석<br><span style="font-size:14px; font-weight:normal; color:#ddd;">(ESAZ Vision Downtime Analysis)</span></h1>
			<p>지속 가능한 데이터 분석 시스템 (Sustainable Data Analysis System)</p>
		</div>

		<div class="tabs">부동 분석 리포트 생성 (Generate Downtime Analysis Report)</div>

		<div class="form-body">
			<div class="form-group">
				<label>종류 (Type) : *</label>
				<select id="type">
					<option value="-">-</option>
					<option value="BM">BM(Breakdown Maintenance) - 예상하지 못한 고장으로 멈춤 (카메라, PC, 조명 이상 등)</option>
					<option value="PD">PD(Planned Downtime) - 미리 계획된 정지 (모델 변경, 셋업 등)</option>
					<option value="PM">PM(Preventive Maintenance) - 고장 전에 계획해서 하는 정비 (정기 점검, 청소, 캘리브레이션 등)</option>
					<option value="ETC">ETC - 기타 (Others)</option>
				</select>
			</div>

			<div class="form-group">
				<label>0. Site : *</label>
				<select id="site">
					<option value="-">-</option>
					<option value="ESAZ">ESAZ</option>
				</select>
			</div>

			<div class="form-group">
				<label>1-1. 공정 (Process) : *</label>
				<select id="process" onchange="filterDropdowns()">
					<option value="-">-</option>
				</select>
			</div>

			<div class="form-group">
				<label>1-2. 호기 (Unit No.) : *</label>
				<select id="hogi">
					<option value="-">-</option>
					<option value="1호기">1호기</option>
					<option value="2호기">2호기</option>
				</select>
			</div>

			<div class="form-group">
				<label>2-2. Vision Type : *</label>
				<select id="visionType" onchange="syncFromVision()">
					<option value="-">-</option>
				</select>
			</div>

			<div class="form-group">
				<label>2-3. 원인처 (Source of Cause) : *</label>
				<select id="source">
					<option value="-">-</option>
					<option value="Camera">Camera</option>
					<option value="Lighting">Lighting</option>
					<option value="PC">PC</option>
					<option value="전장 (Electricity)">전장 (Electricity)</option>
					<option value="S/W">S/W</option>
					<option value="H/W">H/W</option>
					<option value="ROI 수정 (ROI Modification)">ROI 수정 (ROI Modification)</option>
					<option value="Recipe 수정 (Recipe Modification)">Recipe 수정 (Recipe Modification)</option>
					<option value="Calibration">Calibration</option>
					<option value="공정불량 (Process Defect)">공정불량 (Process Defect)</option>
					<option value="설비기인 (Machine Issue)">설비기인 (Machine Issue)</option>
				</select>
			</div>

			<div class="form-group">
				<label>3-1. 발생시간 (Occurrence Time) : *</label>
				<div class="time-input-group">
					<input type="datetime-local" id="startTime">
					<button type="button" class="btn-time" onclick="setTimeField('startTime')">현재시각</button>
				</div>
			</div>

			<div class="form-group">
				<label>3-2. 조치완료 (Action Completed Time) : *</label>
				<div class="time-input-group">
					<input type="datetime-local" id="endTime">
					<button type="button" class="btn-time" onclick="setTimeField('endTime')">현재시각</button>
				</div>
			</div>

			<p class="time-hint">※ 시각은 24시간 기준 (예: 2026-11-09 14:30) · [현재시각] 누르면 지금 시각 입력</p>

			<div class="form-group">
				<label>4. 작업자 (PIC) : *</label>
				<input type="text" id="worker" placeholder="이름 입력 (Enter Name)">
			</div>

			<div class="form-group">
				<label>5. 현상 (Phenomenon) : *</label>
				<textarea id="phenomenon" placeholder="현상 입력 (Enter Phenomenon)"></textarea>
			</div>

			<div class="form-group">
				<label>6. 원인 (Cause) : *</label>
				<textarea id="cause" placeholder="원인 입력 (Enter Cause)"></textarea>
			</div>

			<div class="form-group">
				<label>7. 조치 (Action) : *</label>
				<textarea id="action" placeholder="조치 내용 입력 (Enter Action)"></textarea>
			</div>

			<button class="btn-submit" id="submitBtn" onclick="saveAndCopy()">저장 및 리포트 복사 (Save & Copy Report)</button>
			<div class="footer-mark">Made by JBYang</div>
		</div>
	</div>

	<script>
		// 구글 웹앱 URL(macros/s/.../exec) 주소
		const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUultQpJ51dOTZZLkcMWtLToXKPqxmcjoi5ZZEOQ0c2BbYLkskNex5Xyjnl6hrgM_s/exec";

		// 검사기 마스터 데이터: [공정, 검사기 Type(2D/3D/TM), 공정 번호, 공정명]
		const MASTER = [
			["JRS", "2D", "#03", "J/R 양극 상태 검사"],
			["CCW", "2D", "#02", "양극 집전판 원자재 검사"],
			["CCW", "2D", "#04", "CCW 용접 전 검사"],
			["CCW", "2D", "#05", "CCW 용접 후 검사"],
			["CIT", "2D", "#07", "J/R 음극 상태 검사"],
			["CIT", "2D", "#06", "Taping 검사"],
			["LFW", "2D", "#08", "음극 LID 원자재 검사 (4샷)"],
			["LFW", "TM", "#09",
